<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASL Alphabet Recognition</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      gap: 10px;
      min-height: 100vh;
    }
    #stage-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: #000000;
      border: 1px solid #333333;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #webcam {
      display: none;
    }
    #canvas {
      width: 100%;
      height: auto;
      max-height: 55vh;
      display: block;
      object-fit: contain;
    }
    #current-box {
      width: 100%;
      max-width: 480px;
      background: #1e1e1e;
      border: 1px solid #333333;
      padding: 10px 14px;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #current-letter {
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
    }
    #text-box {
      width: 100%;
      max-width: 480px;
      min-height: 60px;
      background: #1e1e1e;
      border: 1px solid #333333;
      padding: 12px;
      font-size: 18px;
      word-break: break-all;
      white-space: pre-wrap;
    }
    #button-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 10px 0;
      font-size: 15px;
      font-weight: 600;
      background: #2a2a2a;
      color: #ffffff;
      border: 1px solid #444444;
      cursor: pointer;
    }
    .btn:active {
      background: #383838;
    }
  </style>
</head>
<body>
  <div id="stage-container">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="current-box">
    <span>현재 인식</span>
    <span id="current-letter">준비 중...</span>
  </div>

  <div id="text-box"></div>

  <div id="button-bar">
    <button id="btn-space" class="btn">Space</button>
    <button id="btn-delete" class="btn">Delete</button>
    <button id="btn-clear" class="btn">Clear</button>
  </div>

  <script type="module">
    import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const currentLetterEl = document.getElementById("current-letter");
    const textBoxEl = document.getElementById("text-box");
    const btnSpace = document.getElementById("btn-space");
    const btnDelete = document.getElementById("btn-delete");
    const btnClear = document.getElementById("btn-clear");

    let text = "";
    let session = null;
    let labels = [];
    let landmarker = null;
    let isBusy = false;
    let lastTimestamp = -1;

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [17, 18], [18, 19], [19, 20],
      [0, 17]
    ];

    function toWristRelative(vector) {
      const out = Float32Array.from(vector);
      for (let hand = 0; hand < 2; hand++) {
        const start = hand * 63;
        let present = false;
        for (let i = start; i < start + 63; i++) {
          if (out[i] !== 0) { present = true; break; }
        }
        if (!present) continue;
        const wx = out[start], wy = out[start + 1], wz = out[start + 2];
        for (let k = 0; k < 21; k++) {
          const i = start + k * 3;
          out[i] -= wx;
          out[i + 1] -= wy;
          out[i + 2] -= wz;
        }
      }
      return out;
    }

    function toScaleNormalised(vector) {
      const out = Float32Array.from(vector);
      for (let hand = 0; hand < 2; hand++) {
        const start = hand * 63;
        let present = false;
        for (let i = start; i < start + 63; i++) {
          if (out[i] !== 0) { present = true; break; }
        }
        if (!present) continue;
        let size = 0;
        for (let k = 0; k < 21; k++) {
          const i = start + k * 3;
          const d = Math.hypot(out[i], out[i + 1], out[i + 2]);
          if (d > size) size = d;
        }
        const divisor = Math.max(size, 1e-8);
        for (let i = start; i < start + 63; i++) out[i] /= divisor;
      }
      return out;
    }

    function transform(vector) {
      return toScaleNormalised(toWristRelative(vector));
    }

    function handMask(v) {
      let left = false, right = false;
      for (let i = 0; i < 63; i++) { if (v[i] !== 0) { left = true; break; } }
      for (let i = 63; i < 126; i++) { if (v[i] !== 0) { right = true; break; } }
      return (left ? 1 : 0) | (right ? 2 : 0);
    }

    class RollingBuffer {
      constructor(length = 12, minFrames = 4) {
        this.length = length;
        this.minFrames = minFrames;
        this.frames = [];
        this.mask = null;
      }
      push(vector) {
        if (!vector) return;
        const m = handMask(vector);
        if (m !== this.mask) {
          this.frames.length = 0;
          this.mask = m;
        }
        this.frames.push(vector);
        if (this.frames.length > this.length) this.frames.shift();
      }
      clear() {
        this.frames.length = 0;
        this.mask = null;
      }
      get ready() { return this.frames.length >= this.minFrames; }
      get fill() { return this.frames.length / this.length; }
      value() {
        if (!this.ready) return null;
        const n = this.frames.length;
        const out = new Float32Array(126);
        const col = new Array(n);
        const mid = n >> 1;
        const even = (n % 2 === 0);
        for (let d = 0; d < 126; d++) {
          for (let f = 0; f < n; f++) col[f] = this.frames[f][d];
          col.sort((a, b) => a - b);
          out[d] = even ? (col[mid - 1] + col[mid]) / 2 : col[mid];
        }
        return out;
      }
    }

    class LetterMerger {
      constructor({ tau = 0.35, minFrames = 8, minHoldTime = 0.35, idleFramesToForget = 12 } = {}) {
        this.tau = tau;
        this.minFrames = minFrames;
        this.minHoldTime = minHoldTime;
        this.idleFramesToForget = idleFramesToForget;
        this.idleFrames = 0;
        this.candidate = null;
        this.lastCommitted = null;
      }
      update(label, confidence, now = performance.now() / 1000) {
        if (!label || confidence < this.tau) {
          this.idleFrames++;
          this.candidate = null;
          if (this.idleFrames >= this.idleFramesToForget) this.lastCommitted = null;
          return null;
        }
        this.idleFrames = 0;
        if (!this.candidate || this.candidate.label !== label) {
          this.candidate = { label, frames: 0, sum: 0, startedAt: now, committed: false };
        }
        const c = this.candidate;
        c.frames++;
        c.sum += confidence;
        if (c.committed) return null;
        if (!(c.frames >= this.minFrames && (now - c.startedAt) >= this.minHoldTime && (c.sum / c.frames) >= this.tau)) {
          return null;
        }
        c.committed = true;
        if (label === this.lastCommitted) return null;
        this.lastCommitted = label;
        return label;
      }
    }

    const buffer = new RollingBuffer(12, 4);
    const merger = new LetterMerger();

    function updateText() {
      textBoxEl.textContent = text;
      if (window.AppInventor && typeof window.AppInventor.setWebViewString === "function") {
        window.AppInventor.setWebViewString(text);
      }
    }

    btnSpace.addEventListener("click", () => { text += " "; updateText(); });
    btnDelete.addEventListener("click", () => { text = text.slice(0, -1); updateText(); });
    btnClear.addEventListener("click", () => { text = ""; updateText(); });

    function drawSkeleton(landmarks, w, h) {
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = "#00FF00";
      ctx.fillStyle = "#FF0000";
      for (const pts of landmarks) {
        ctx.beginPath();
        for (const [a, b] of HAND_CONNECTIONS) {
          if (!pts[a] || !pts[b]) continue;
          ctx.moveTo(pts[a].x * w, pts[a].y * h);
          ctx.lineTo(pts[b].x * w, pts[b].y * h);
        }
        ctx.stroke();
        for (const p of pts) {
          ctx.beginPath();
          ctx.arc(p.x * w, p.y * h, 3.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function toRawVector(result) {
      if (!result?.landmarks?.length) return null;
      const vector = new Float32Array(126);
      const filled = [false, false];
      const handedness = result.handedness ?? [];

      for (let i = 0; i < result.landmarks.length; i++) {
        const raw = handedness[i]?.[0]?.categoryName ?? "Left";
        const userHand = (raw === "Left") ? "Right" : "Left";
        let slot = (userHand === "Left") ? 0 : 1;

        if (filled[slot]) {
          const other = 1 - slot;
          if (filled[other]) continue;
          slot = other;
        }

        const start = slot * 63;
        const pts = result.landmarks[i];
        for (let k = 0; k < 21; k++) {
          const p = pts[k];
          const at = start + k * 3;
          vector[at] = p.x;
          vector[at + 1] = p.y;
          vector[at + 2] = p.z;
        }
        filled[slot] = true;
      }
      return vector;
    }

    let noHandFrames = 0;

    async function loop(now) {
      if (video.videoWidth && (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight)) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }

      const w = canvas.width;
      const h = canvas.height;

      ctx.save();
      ctx.translate(w, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, w, h);
      ctx.restore();

      let ts = Math.round(now);
      if (ts <= lastTimestamp) ts = lastTimestamp + 1;
      lastTimestamp = ts;

      let result = null;
      if (landmarker) {
        try {
          result = landmarker.detectForVideo(canvas, ts);
        } catch (e) {}
      }

      if (result?.landmarks?.length) {
        drawSkeleton(result.landmarks, w, h);
      }

      const vector = toRawVector(result);
      if (vector) {
        noHandFrames = 0;
        buffer.push(vector);
      } else {
        noHandFrames++;
        if (noHandFrames >= 5) {
          buffer.clear();
        }
      }

      if (!isBusy && session) {
        isBusy = true;
        try {
          const aggregated = buffer.value();
          let predictedLabel = null;
          let confidence = 0;

          if (aggregated && vector) {
            const feat = transform(aggregated);
            const tensor = new ort.Tensor("float32", feat, [1, 126]);
            const output = await session.run({ input: tensor });
            const probs = output.probabilities.data;

            let best = 0;
            for (let i = 1; i < probs.length; i++) {
              if (probs[i] > probs[best]) best = i;
            }
            predictedLabel = labels[best] ?? null;
            confidence = probs[best];
          }

          if (predictedLabel) {
            currentLetterEl.textContent = predictedLabel;
          } else if (result?.landmarks?.length) {
            currentLetterEl.textContent = "동작 분석 중...";
          } else {
            currentLetterEl.textContent = "-";
          }

          const committed = merger.update(predictedLabel, confidence, now / 1000);
          if (committed) {
            text += committed;
            updateText();
          }
        } catch (err) {
          console.error("추론 오류:", err);
        } finally {
          isBusy = false;
        }
      }

      requestAnimationFrame(loop);
    }

    async function init() {
      currentLetterEl.textContent = "AI 로딩 중...";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 },
            facingMode: "user"
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
      } catch (camErr) {
        currentLetterEl.textContent = "카메라 오류";
        return;
      }

      requestAnimationFrame(loop);

      try {
        ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";
        ort.env.wasm.numThreads = 1;

        const [labelsData, sess, fileset] = await Promise.all([
          fetch("models/labels.json").then((r) => r.json()),
          ort.InferenceSession.create("models/asl_svm.onnx", { executionProviders: ["wasm"] }),
          FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm")
        ]);

        labels = labelsData;
        session = sess;

        let modelAssetPath = "models/hand_landmarker.task";
        const options = {
          runningMode: "VIDEO",
          numHands: 1, // 수화 알파벳(지화자) 1개 손 집중 감지로 성능 및 정확도 대폭 향상
          minHandDetectionConfidence: 0.5,
          minHandPresenceConfidence: 0.5,
          minTrackingConfidence: 0.5
        };

        try {
          landmarker = await HandLandmarker.createFromOptions(fileset, {
            baseOptions: { modelAssetPath, delegate: "GPU" },
            ...options
          });
        } catch (gpuErr) {
          try {
            landmarker = await HandLandmarker.createFromOptions(fileset, {
              baseOptions: { modelAssetPath, delegate: "CPU" },
              ...options
            });
          } catch (cpuErr) {
            modelAssetPath = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
            landmarker = await HandLandmarker.createFromOptions(fileset, {
              baseOptions: { modelAssetPath, delegate: "CPU" },
              ...options
            });
          }
        }

        currentLetterEl.textContent = "-";
      } catch (loadErr) {
        console.error("모델 로딩 실패:", loadErr);
        currentLetterEl.textContent = "모델 로딩 실패";
      }
    }

    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
