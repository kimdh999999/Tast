<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MediaPipe 수화 인식</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 2;
      pointer-events: none;
    }
    #bottom-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 16px;
      z-index: 10;
    }
    #recognized-text {
      color: #00FF66;
      font-size: 28px;
      font-weight: bold;
      min-width: 160px;
      letter-spacing: 2px;
      word-break: break-all;
    }
    #clear-btn {
      font-size: 16px;
      font-weight: bold;
      background: #e53e3e;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
    }
    #clear-btn:active {
      background: #c53030;
    }
  </style>
</head>
<body>

  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <div id="bottom-bar">
    <span id="recognized-text"></span>
    <button id="clear-btn">Clear</button>
  </div>

  <script type="module" crossorigin="anonymous">
    import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const recognizedTextEl = document.getElementById('recognized-text');
    const clearBtn = document.getElementById('clear-btn');

    let handLandmarker = null;
    let sentence = '';
    let currentLetter = '';
    let lastInputTime = 0;
    const COOLDOWN_MS = 1000; // 한 문자 인식 후 1초 대기

    let stableChar = null;
    let stableCount = 0;
    const STABLE_REQUIRED = 8; // 안정적 인식 유지 프레임 수 (~250ms)

    // 21개 관절 연결선
    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],          // 엄지
      [0, 5], [5, 6], [6, 7], [7, 8],          // 검지
      [0, 9], [9, 10], [10, 11], [11, 12],     // 중지
      [0, 13], [13, 14], [14, 15], [15, 16],   // 약지
      [0, 17], [17, 18], [18, 19], [19, 20],   // 소지
      [5, 9], [9, 13], [13, 17], [0, 17]       // 손바닥
    ];

    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    // 사진(ASL 지화 차트) 기반 알파벳 판별 함수
    function classifyAlphabet(lm) {
      const palm = dist(lm[0], lm[9]); // 손목~중지뿌리 척도
      if (palm < 0.01) return null;

      // 손가락 펴짐 판정 (엄지, 검지, 중지, 약지, 소지)
      const tExt = dist(lm[4], lm[9]) > palm * 0.75 && dist(lm[4], lm[2]) > palm * 0.45;
      const iExt = dist(lm[8], lm[0]) > dist(lm[6], lm[0]) * 1.15 && dist(lm[8], lm[5]) > palm * 0.65;
      const mExt = dist(lm[12], lm[0]) > dist(lm[10], lm[0]) * 1.15 && dist(lm[12], lm[9]) > palm * 0.65;
      const rExt = dist(lm[16], lm[0]) > dist(lm[14], lm[0]) * 1.15 && dist(lm[16], lm[13]) > palm * 0.65;
      const pExt = dist(lm[20], lm[0]) > dist(lm[18], lm[0]) * 1.15 && dist(lm[20], lm[17]) > palm * 0.65;

      const dThumbIndex = dist(lm[4], lm[8]);
      const dThumbMiddle = dist(lm[4], lm[12]);
      const dIndexMiddle = dist(lm[8], lm[12]);

      const indexDx = lm[8].x - lm[5].x;
      const indexDy = lm[8].y - lm[5].y;
      const isHorizontal = Math.abs(indexDx) > Math.abs(indexDy) * 1.1;
      const isDownward = indexDy > palm * 0.3 && lm[8].y > lm[0].y;

      // 1. Y: 엄지 + 소지만 펴짐
      if (tExt && pExt && !iExt && !mExt && !rExt) {
        return 'Y';
      }

      // 2. L: 엄지 + 검지만 펴져 직각(L자) 형성
      if (tExt && iExt && !mExt && !rExt && !pExt && !isHorizontal && !isDownward) {
        if (dThumbIndex > palm * 0.6) return 'L';
      }

      // 3. W: 검지 + 중지 + 약지 펴짐
      if (iExt && mExt && rExt && !pExt) {
        return 'W';
      }

      // 4. B: 4개 손가락 모두 위로 펴짐
      if (iExt && mExt && rExt && pExt) {
        return 'B';
      }

      // 5. F: 엄지와 검지가 맞닿고(원형), 나머지 3손가락 펴짐 (OK 모양)
      if (!iExt && mExt && rExt && pExt && dThumbIndex < palm * 0.45) {
        return 'F';
      }

      // 6. I: 소지만 펴짐
      if (!iExt && !mExt && !rExt && pExt && !tExt) {
        return 'I';
      }

      // 7. 가로 방향 제스처: G, H
      if (isHorizontal && !isDownward) {
        if (iExt && !mExt && !rExt && !pExt) return 'G';
        if (iExt && mExt && !rExt && !pExt) return 'H';
      }

      // 8. 아래 방향 제스처: P, Q
      if (isDownward) {
        if (iExt && mExt && !rExt && !pExt) return 'P';
        if (iExt && !mExt && !rExt && !pExt) return 'Q';
      }

      // 9. D & X: 검지만 펴짐
      if (iExt && !mExt && !rExt && !pExt && !isHorizontal && !isDownward) {
        // 검지가 갈고리 모양으로 굽혀진 경우 -> X
        if (dist(lm[8], lm[6]) < palm * 0.4) return 'X';
        // 검지가 곧게 위로 펴진 경우 -> D
        return 'D';
      }

      // 10. 검지 + 중지 펴짐: V, U, R, K
      if (iExt && mExt && !rExt && !pExt && !isHorizontal && !isDownward) {
        // K: 엄지가 검지와 중지 사이에서 위로 솟아오름
        if (tExt && dist(lm[4], lm[6]) < palm * 0.45 && lm[4].y < lm[2].y) {
          return 'K';
        }
        // R: 검지와 중지가 서로 교차(크로스)
        const mcpDx = lm[9].x - lm[5].x;
        const tipDx = lm[12].x - lm[8].x;
        if ((mcpDx > 0 && tipDx < 0) || (mcpDx < 0 && tipDx > 0)) {
          return 'R';
        }
        // V vs U: 손가락 벌림 여부
        if (dIndexMiddle > palm * 0.38) {
          return 'V';
        } else {
          return 'U';
        }
      }

      // 11. C & O: 둥글게 모은 형태
      const isCurved = dist(lm[8], lm[0]) > dist(lm[6], lm[0]) * 0.9 && !iExt;
      if (isCurved && dist(lm[12], lm[0]) > dist(lm[10], lm[0]) * 0.9) {
        if (dThumbIndex < palm * 0.35 && dThumbMiddle < palm * 0.45) {
          return 'O';
        } else if (dThumbIndex >= palm * 0.35 && dThumbIndex < palm * 0.85) {
          return 'C';
        }
      }

      // 12. 주먹 계열 (4손가락 접힘): A, S, E, T, M, N
      if (!iExt && !mExt && !rExt && !pExt) {
        // A: 엄지가 검지 옆에 붙어 위를 향함
        if (lm[4].y < lm[6].y && dist(lm[4], lm[5]) < palm * 0.5) {
          return 'A';
        }
        // E: 손가락 끝 아래로 엄지가 접힘
        if (lm[4].y > lm[8].y && lm[4].y > lm[12].y) {
          return 'E';
        }
        // T: 엄지가 검지와 중지 사이에 끼임
        if (dist(lm[4], lm[6]) < palm * 0.35 && dist(lm[4], lm[10]) < palm * 0.35) {
          return 'T';
        }
        // S: 엄지가 주먹 앞을 가로질러 덮음
        if (dist(lm[4], lm[10]) < palm * 0.4) {
          return 'S';
        }
        return 'A';
      }

      return null;
    }

    // 손목 근처에 현재 인식 중인 글자 출력
    function drawWristText(text, x, y) {
      if (!text) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(-1, 1); // 캔버스 좌우반전 상쇄
      ctx.font = "bold 44px sans-serif";
      ctx.fillStyle = "#FFFF00";
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 4;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.strokeText(text, 0, 0);
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }

    // 21개 관절 및 뼈대 그리기
    function drawSkeleton(landmarks, w, h) {
      ctx.strokeStyle = "#00FF66";
      ctx.lineWidth = 3.5;
      ctx.lineCap = "round";

      for (let conn of HAND_CONNECTIONS) {
        ctx.beginPath();
        ctx.moveTo(landmarks[conn[0]].x * w, landmarks[conn[0]].y * h);
        ctx.lineTo(landmarks[conn[1]].x * w, landmarks[conn[1]].y * h);
        ctx.stroke();
      }

      for (let pt of landmarks) {
        ctx.beginPath();
        ctx.arc(pt.x * w, pt.y * h, 4.5, 0, 2 * Math.PI);
        ctx.fillStyle = "#FF0055";
        ctx.fill();
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    // 문자 인식 및 1초 간격 입력 제어
    function processRecognition(detectedChar) {
      currentLetter = detectedChar || '';

      if (!detectedChar) {
        stableChar = null;
        stableCount = 0;
        return;
      }

      if (detectedChar === stableChar) {
        stableCount++;
      } else {
        stableChar = detectedChar;
        stableCount = 1;
      }

      const now = performance.now();

      // 한 문자가 입력된 후 1초 후에 다음 글자가 입력 가능
      if (stableCount >= STABLE_REQUIRED && (now - lastInputTime >= COOLDOWN_MS)) {
        sentence += stableChar;
        recognizedTextEl.textContent = sentence;

        if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
          window.AppInventor.setWebViewString(sentence);
        }

        lastInputTime = now;
        stableCount = 0;
      }
    }

    // Clear 버튼 클릭 시 전체 삭제
    clearBtn.addEventListener('click', () => {
      sentence = '';
      recognizedTextEl.textContent = '';
      if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
        window.AppInventor.setWebViewString('');
      }
    });

    // 메인 렌더링 루프
    function onFrame() {
      if (video.videoWidth && (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight)) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (handLandmarker && video.readyState >= 2) {
        const result = handLandmarker.detectForVideo(video, performance.now());
        if (result && result.landmarks && result.landmarks.length > 0) {
          const lm = result.landmarks[0];
          const w = canvas.width;
          const h = canvas.height;

          // 1. 21개 관절 뼈대 그리기
          drawSkeleton(lm, w, h);

          // 2. 수화 알파벳 판별
          const char = classifyAlphabet(lm);
          processRecognition(char);

          // 3. 현재 인식 중인 글자를 손목(관절 0번) 근처에 표시
          const wristX = lm[0].x * w;
          const wristY = lm[0].y * h + 45;
          drawWristText(currentLetter, wristX, wristY);
        } else {
          processRecognition(null);
        }
      }

      requestAnimationFrame(onFrame);
    }

    // 카메라 및 MediaPipe 초기화
    async function init() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      const modelAssetPath = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
      const modelOptions = {
        runningMode: "VIDEO",
        numHands: 1,
        minHandDetectionConfidence: 0.35,
        minHandPresenceConfidence: 0.35,
        minTrackingConfidence: 0.35
      };

      try {
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: modelAssetPath, delegate: "GPU" },
          ...modelOptions
        });
      } catch (e) {
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: modelAssetPath, delegate: "CPU" },
          ...modelOptions
        });
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = fallbackStream;
        await video.play();
      }

      requestAnimationFrame(onFrame);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
