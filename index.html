<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MediaPipe 수화 인식</title>

  <!-- 사용자 업로드 사진 차트에서 직접 추출한 26개 알파벳 기준 모델 로드 -->
  <script src="asl_model.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 2;
      pointer-events: none;
    }
    /* 하단 단순 UI: 인식된 문장 + Clear 버튼만 배치 */
    #bottom-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 16px;
      z-index: 10;
    }
    #recognized-text {
      color: #00FF66;
      font-size: 28px;
      font-weight: bold;
      min-width: 150px;
      min-height: 34px;
      letter-spacing: 2px;
      word-break: break-all;
      display: flex;
      align-items: center;
    }
    #clear-btn {
      font-size: 16px;
      font-weight: bold;
      background: #e53e3e;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
    }
    #clear-btn:active {
      background: #c53030;
    }
  </style>
</head>
<body>

  <!-- 카메라 원본 비디오 -->
  <video id="video" playsinline autoplay muted></video>

  <!-- 21개 관절 뼈대 및 손목 글자 캔버스 -->
  <canvas id="canvas"></canvas>

  <!-- 하단 바: 인식 문장과 Clear 버튼만 투박하게 배치 -->
  <div id="bottom-bar">
    <span id="recognized-text"></span>
    <button id="clear-btn">Clear</button>
  </div>

  <script type="module" crossorigin="anonymous">
    import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const recognizedTextEl = document.getElementById('recognized-text');
    const clearBtn = document.getElementById('clear-btn');

    let handLandmarker = null;
    let sentence = '';
    let currentLetter = '';
    let lastInputTime = 0;
    const COOLDOWN_MS = 1000; // 한 문자 인식 후 1초 대기

    let stableChar = null;
    let stableCount = 0;
    const STABLE_REQUIRED = 6; // 약 180~200ms 유지 시 확정 후보 판정

    // 21개 관절 연결선
    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],          // 엄지
      [0, 5], [5, 6], [6, 7], [7, 8],          // 검지
      [0, 9], [9, 10], [10, 11], [11, 12],     // 중지
      [0, 13], [13, 14], [14, 15], [15, 16],   // 약지
      [0, 17], [17, 18], [18, 19], [19, 20],   // 소지
      [5, 9], [9, 13], [13, 17], [0, 17]       // 손바닥
    ];

    /* ==========================================================================
       1. 손 자체 기준 로컬 3D 좌표계 정규화 (손 회전/거리/기울기 불변)
       ========================================================================== */
    function normalizeHand(landmarks) {
      const w = landmarks[0];
      const translated = landmarks.map(p => ({
        x: p.x - w.x,
        y: p.y - w.y,
        z: (p.z || 0) - (w.z || 0)
      }));

      const m9 = translated[9];
      const scale = Math.hypot(m9.x, m9.y, m9.z) || 1e-6;
      const scaled = translated.map(p => ({
        x: p.x / scale,
        y: p.y / scale,
        z: p.z / scale
      }));

      const uy = { x: scaled[9].x, y: scaled[9].y, z: scaled[9].z };
      const v_palm = {
        x: scaled[17].x - scaled[5].x,
        y: scaled[17].y - scaled[5].y,
        z: scaled[17].z - scaled[5].z
      };

      let uz = {
        x: uy.y * v_palm.z - uy.z * v_palm.y,
        y: uy.z * v_palm.x - uy.x * v_palm.z,
        z: uy.x * v_palm.y - uy.y * v_palm.x
      };
      const len_z = Math.hypot(uz.x, uz.y, uz.z) || 1e-6;
      uz = { x: uz.x / len_z, y: uz.y / len_z, z: uz.z / len_z };

      let ux = {
        x: uy.y * uz.z - uy.z * uz.y,
        y: uy.z * uz.x - uy.x * uz.z,
        z: uy.x * uz.y - uy.y * uz.x
      };
      const len_x = Math.hypot(ux.x, ux.y, ux.z) || 1e-6;
      ux = { x: ux.x / len_x, y: ux.y / len_x, z: ux.z / len_x };

      return scaled.map(p => ({
        x: p.x * ux.x + p.y * ux.y + p.z * ux.z,
        y: p.x * uy.x + p.y * uy.y + p.z * uy.z,
        z: p.x * uz.x + p.y * uz.y + p.z * uz.z
      }));
    }

    function ndist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y, p1.z - p2.z);
    }

    /* ==========================================================================
       2. 사용자 사진 차트에서 추출된 기준 데이터셋 매칭 (ASL_MODEL)
       ========================================================================== */
    function classifyByPhotoChartModel(norm) {
      if (!window.ASL_MODEL) return null;

      // 현재 손의 63차원 벡터 생성
      const vec = [];
      for (let p of norm) vec.push(p.x, p.y, p.z);

      let bestChar = null;
      let bestDist = Infinity;

      for (let char in window.ASL_MODEL) {
        const samples = window.ASL_MODEL[char];
        for (let s of samples) {
          let sumSq = 0;
          for (let i = 0; i < 63; i++) {
            const diff = vec[i] - s[i];
            sumSq += diff * diff;
          }
          if (sumSq < bestDist) {
            bestDist = sumSq;
            bestChar = char;
          }
        }
      }

      const d = Math.sqrt(bestDist);
      // 유클리드 거리가 1.35 이내면 사진 차트 데이터셋의 판별 신뢰 채택
      if (d < 1.35) {
        return bestChar;
      }
      return null;
    }

    /* ==========================================================================
       3. 사진 차트 형태 기반 정밀 기하학 규칙 엔진 (보정 및 폴백)
       ========================================================================== */
    function classifyGeometricASL(norm) {
      const iExt = norm[8].y > 1.35;
      const mExt = norm[12].y > 1.35;
      const rExt = norm[16].y > 1.30;
      const pExt = norm[20].y > 1.25;
      const tExt = Math.hypot(norm[4].x, norm[4].y) > 0.85 || norm[4].x < -0.45;

      const dThumbIndex = ndist(norm[4], norm[8]);
      const dIndexMiddle = ndist(norm[8], norm[12]);

      // Y (Shaka): 엄지 + 소지
      if (tExt && pExt && !iExt && !mExt && !rExt) return 'Y';

      // L: 엄지 + 검지 직각
      if (tExt && iExt && !mExt && !rExt && !pExt && dThumbIndex > 0.6) return 'L';

      // W: 3손가락
      if (iExt && mExt && rExt && !pExt) return 'W';

      // B: 4손가락
      if (iExt && mExt && rExt && pExt) return 'B';

      // F: OK 손모양
      if (!iExt && mExt && rExt && pExt && dThumbIndex < 0.35) return 'F';

      // I: 소지만 펴짐
      if (!iExt && !mExt && !rExt && pExt && !tExt) return 'I';

      // D & X: 검지만 펴진 형태
      if (iExt && !mExt && !rExt && !pExt) {
        if (norm[8].y < norm[6].y + 0.1) return 'X';
        return 'D';
      }

      // V, U, R, K: 2손가락
      if (iExt && mExt && !rExt && !pExt) {
        if (tExt && norm[4].y > 0.6 && norm[4].y < norm[8].y) return 'K';
        if (norm[8].x > norm[12].x + 0.05) return 'R';
        if (dIndexMiddle > 0.35) return 'V';
        return 'U';
      }

      // C & O
      const isCurved = norm[8].y > 0.8 && norm[8].y < 1.35 && !iExt;
      if (isCurved && norm[12].y > 0.8 && norm[12].y < 1.35) {
        if (dThumbIndex < 0.30) return 'O';
        if (dThumbIndex < 0.80) return 'C';
      }

      // 주먹 계열 (A, S, E, T)
      if (!iExt && !mExt && !rExt && !pExt) {
        if (norm[4].y > 0.80 && norm[4].x < -0.15) return 'A';
        if (norm[4].y < norm[8].y && norm[4].y < norm[12].y) return 'E';
        if (norm[4].x >= -0.20 && norm[4].x <= 0.05 && norm[4].y > 0.55 && norm[4].y < 0.90) return 'T';
        if (norm[4].z > 0.12) return 'S';
        return 'A';
      }

      return null;
    }

    // 손목 근처에 현재 인식 중인 글자 출력
    function drawWristText(text, x, y) {
      if (!text) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(-1, 1);
      ctx.font = "bold 46px sans-serif";
      ctx.fillStyle = "#FFFF00";
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 4;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.strokeText(text, 0, 0);
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }

    // 21개 관절 및 뼈대 그리기
    function drawSkeleton(landmarks, w, h) {
      ctx.strokeStyle = "#00FF66";
      ctx.lineWidth = 3.5;
      ctx.lineCap = "round";

      for (let conn of HAND_CONNECTIONS) {
        ctx.beginPath();
        ctx.moveTo(landmarks[conn[0]].x * w, landmarks[conn[0]].y * h);
        ctx.lineTo(landmarks[conn[1]].x * w, landmarks[conn[1]].y * h);
        ctx.stroke();
      }

      for (let pt of landmarks) {
        ctx.beginPath();
        ctx.arc(pt.x * w, pt.y * h, 4.5, 0, 2 * Math.PI);
        ctx.fillStyle = "#FF0055";
        ctx.fill();
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    // 1초 간격 입력 제어
    function processRecognition(detectedChar) {
      currentLetter = detectedChar || '';

      if (!detectedChar) {
        stableChar = null;
        stableCount = 0;
        return;
      }

      if (detectedChar === stableChar) {
        stableCount++;
      } else {
        stableChar = detectedChar;
        stableCount = 1;
      }

      const now = performance.now();

      // 한 문자가 입력된 후 1초 후에 다음 글자 입력
      if (stableCount >= STABLE_REQUIRED && (now - lastInputTime >= COOLDOWN_MS)) {
        sentence += stableChar;
        recognizedTextEl.textContent = sentence;

        if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
          window.AppInventor.setWebViewString(sentence);
        }

        lastInputTime = now;
        stableCount = 0;
      }
    }

    // Clear 버튼 클릭 시 전체 삭제
    clearBtn.addEventListener('click', () => {
      sentence = '';
      recognizedTextEl.textContent = '';
      if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
        window.AppInventor.setWebViewString('');
      }
    });

    // 메인 렌더링 루프
    function onFrame() {
      if (video.videoWidth && (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight)) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (handLandmarker && video.readyState >= 2) {
        const result = handLandmarker.detectForVideo(video, performance.now());
        if (result && result.landmarks && result.landmarks.length > 0) {
          const rawLm = result.landmarks[0];
          const baseLm = (result.worldLandmarks && result.worldLandmarks.length > 0) ? result.worldLandmarks[0] : rawLm;

          const w = canvas.width;
          const h = canvas.height;

          // 1. 관절 뼈대 렌더링
          drawSkeleton(rawLm, w, h);

          // 2. 손 회전/크기 정규화
          const norm = normalizeHand(baseLm);

          // 3. 사진 차트 기준 모델 매칭 -> 기하학 규칙 보완
          let char = classifyByPhotoChartModel(norm);
          if (!char) {
            char = classifyGeometricASL(norm);
          }

          processRecognition(char);

          // 4. 손목 근처에 현재 인식 중인 글자 출력
          const wristX = rawLm[0].x * w;
          const wristY = rawLm[0].y * h + 45;
          drawWristText(currentLetter, wristX, wristY);
        } else {
          processRecognition(null);
        }
      }

      requestAnimationFrame(onFrame);
    }

    // 카메라 및 모델 초기화
    async function init() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      const modelAssetPath = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
      const modelOptions = {
        runningMode: "VIDEO",
        numHands: 1,
        minHandDetectionConfidence: 0.35,
        minHandPresenceConfidence: 0.35,
        minTrackingConfidence: 0.35
      };

      try {
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: modelAssetPath, delegate: "GPU" },
          ...modelOptions
        });
      } catch (e) {
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: modelAssetPath, delegate: "CPU" },
          ...modelOptions
        });
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = fallbackStream;
        await video.play();
      }

      requestAnimationFrame(onFrame);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
