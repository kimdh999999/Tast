<!--
================================================================================
 [앱 인벤터 수화 인식기 - 최종 완성본]
================================================================================
 * 모바일 최적화:
   1. 안드로이드 하드웨어 가속 비디오 디코더 활성화 (전체화면 GPU 렌더링)
   2. 갤럭시 S25 9:16 세로 풀스크린 최적화 (3배 줌인 및 오징어 왜곡 제거)
   3. 셀카 거울 모드 (손 이동 방향과 화면 100% 일치)
   4. 손 크기 무관 상대 비율(Scale-Invariant) 10개 수화 판별
   5. 800ms 유지 확정 + 400ms 프레임 드랍 유예 (끊김 없는 안정적 인식)
   6. window.AppInventor.setWebViewString 자동 전송
================================================================================
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>수화 인식기</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* 1. 전체화면 비디오: contain으로 3배 확대/크롭 왜곡을 100% 제거하고 기본 카메라 화각 복원 */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      z-index: 1;
      transform: scaleX(-1); /* 영구 셀카 거울 모드 유지 */
    }

    /* 2. 손가락 뼈대 투명 캔버스 (비디오와 1:1 완벽 정렬) */
    #output-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      z-index: 2;
      background: transparent;
      pointer-events: none;
      transform: scaleX(-1); /* 영구 셀카 거울 모드 유지 */
    }

    /* 상단 HUD: 수화 번역 및 확정 */
    #top-hud {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 450px;
      margin-top: 16px;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #333333;
      border-radius: 20px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.9);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #top-hud.confirmed {
      border-color: #00FF66;
      box-shadow: 0 0 32px rgba(0, 255, 102, 0.7);
    }

    .main-gesture-text {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .confirmed-badge {
      display: none;
      background: #00FF66;
      color: #000000;
      font-size: 14px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      vertical-align: middle;
      animation: pop 0.2s ease-out;
    }

    @keyframes pop {
      0% { transform: scale(0.7); }
      100% { transform: scale(1.0); }
    }

    .sub-info {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #BBBBBB;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .confidence-val {
      color: #00FF66;
      font-weight: 700;
    }

    .progress-bar-bg {
      margin-top: 10px;
      width: 100%;
      height: 8px;
      background: #222222;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00BFFF, #00FF66);
      transition: width 0.05s linear;
    }

    #gesture-tip {
      margin-top: 8px;
      font-size: 13px;
      color: #00E5FF;
      font-weight: 600;
    }

    /* 하단 HUD: 손가락 관절 상태 */
    #bottom-hud {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 450px;
      margin-bottom: 18px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #333333;
      border-radius: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
    }

    .debug-title {
      font-size: 12px;
      font-weight: 600;
      color: #888888;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .fingers-container {
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }

    .finger-pill {
      flex: 1;
      padding: 7px 2px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      background: #1A1A1A;
      border: 1px solid #333333;
      border-radius: 8px;
      color: #777777;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }

    .finger-pill.active {
      background: rgba(0, 255, 102, 0.25);
      border-color: #00FF66;
      color: #00FF66;
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.35);
    }

    /* 에러 알림 모달 */
    #error-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 0, 0, 0.94);
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    #error-modal h2 {
      font-size: 24px;
      color: #FF4444;
      margin-bottom: 14px;
    }

    #error-modal p {
      font-size: 15px;
      color: #DDDDDD;
      line-height: 1.6;
      margin-bottom: 12px;
      word-break: keep-all;
    }
  </style>
</head>
<body>

  <!-- 카메라 원본 비디오 (상시 렌더링) -->
  <video id="webcam" playsinline autoplay muted></video>

  <!-- 관절 뼈대 렌더링 캔버스 -->
  <canvas id="output-canvas"></canvas>

  <!-- 상단 HUD: 수화 번역 결과 -->
  <div id="top-hud">
    <div class="main-gesture-text">
      <span id="gesture-name">AI 모델 준비 중...</span>
      <span id="confirmed-badge" class="confirmed-badge">전송 완료</span>
    </div>
    <div class="sub-info">
      <div>신뢰도: <span id="confidence-val" class="confidence-val">0%</span></div>
      <div>상태: <span id="status-text">준비 중</span></div>
    </div>
    <div class="progress-bar-bg">
      <div id="progress-bar-fill" class="progress-bar-fill"></div>
    </div>
    <div id="gesture-tip">카메라에 손을 보여주세요 👋</div>
  </div>

  <!-- 하단 HUD: 손가락 상태 -->
  <div id="bottom-hud">
    <div class="debug-title">
      <span id="diag-summary">진단: 엔진 준비 중</span>
      <span id="fps-counter">0 FPS</span>
    </div>
    <div class="fingers-container">
      <div id="pill-0" class="finger-pill">엄지 OFF</div>
      <div id="pill-1" class="finger-pill">검지 OFF</div>
      <div id="pill-2" class="finger-pill">중지 OFF</div>
      <div id="pill-3" class="finger-pill">약지 OFF</div>
      <div id="pill-4" class="finger-pill">소지 OFF</div>
    </div>
  </div>

  <!-- 에러 안내 모달 -->
  <div id="error-modal">
    <h2>🚨 카메라 접근 실패</h2>
    <p>HTTPS 보안 컨텍스트 또는 앱 인벤터의 카메라 권한 설정을 확인하세요.</p>
  </div>

  <!-- 최신 MediaPipe Tasks Vision ES 모듈 로드 -->
  <script type="module" crossorigin="anonymous">
    import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    /* ==========================================================================
       1. DOM 요소 및 상태 변수
       ========================================================================== */
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');

    const gestureNameEl = document.getElementById('gesture-name');
    const confirmedBadgeEl = document.getElementById('confirmed-badge');
    const confidenceValEl = document.getElementById('confidence-val');
    const statusTextEl = document.getElementById('status-text');
    const progressBarFillEl = document.getElementById('progress-bar-fill');
    const gestureTipEl = document.getElementById('gesture-tip');
    const topHudEl = document.getElementById('top-hud');
    const fpsCounterEl = document.getElementById('fps-counter');
    const diagSummaryEl = document.getElementById('diag-summary');
    const errorModalEl = document.getElementById('error-modal');

    const fingerPills = [
      document.getElementById('pill-0'),
      document.getElementById('pill-1'),
      document.getElementById('pill-2'),
      document.getElementById('pill-3'),
      document.getElementById('pill-4')
    ];

    let handLandmarker = null;
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let lastInferTime = 0;

    // 수화 판정 및 800ms 디바운스 변수
    let candidateGesture = null;
    let candidateStartTime = 0;
    let lastSeenTime = 0;
    const DEBOUNCE_HOLD_TIME_MS = 800;
    let lastSentGesture = null;

    let motionHistory = [];
    let dynamicLatch = { gesture: null, expireTime: 0, confidence: 0, tip: '' };

    // 21개 관절 연결선
    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],          // 엄지
      [0, 5], [5, 6], [6, 7], [7, 8],          // 검지
      [0, 9], [9, 10], [10, 11], [11, 12],     // 중지
      [0, 13], [13, 14], [14, 15], [15, 16],   // 약지
      [0, 17], [17, 18], [18, 19], [19, 20],   // 소지
      [5, 9], [9, 13], [13, 17], [0, 17]       // 손바닥 윤곽
    ];

    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    // 앱 인벤터 통신 (부재 시 콘솔 출력)
    function sendToAppInventor(confirmedText) {
      if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
        window.AppInventor.setWebViewString(confirmedText);
      } else {
        console.log('[AppInventor 수화 전송]:', confirmedText);
      }
    }

    /* ==========================================================================
       2. 손 크기 무관 상대 비율(Scale-Invariant) 손가락 펴짐 판정
       ========================================================================== */
    function detectFingerExtensions(lm) {
      const ext = [false, false, false, false, false];
      const palmScale = dist(lm[0], lm[9]); // 손목~중지뿌리 기준 척도

      const joints = [
        null,
        { tip: 8,  pip: 6 },
        { tip: 12, pip: 10 },
        { tip: 16, pip: 14 },
        { tip: 20, pip: 18 }
      ];

      for (let i = 1; i <= 4; i++) {
        const j = joints[i];
        ext[i] = (dist(lm[j.tip], lm[0]) > dist(lm[j.pip], lm[0]) * 1.02);
      }

      // 엄지 (소지뿌리, 검지뿌리 상대 거리)
      ext[0] = (dist(lm[4], lm[17]) > dist(lm[3], lm[17]) * 1.05) && 
               (dist(lm[4], lm[5]) > palmScale * 0.28) && 
               (dist(lm[4], lm[0]) > dist(lm[2], lm[0]) * 1.04);

      return ext;
    }

    function checkHorizontalWaving(history, key) {
      if (history.length < 4) return false;
      let dirSwitches = 0;
      let lastDir = 0;
      let lastVal = history[0][key].x;
      let totalTravel = 0;

      for (let i = 1; i < history.length; i++) {
        const curVal = history[i][key].x;
        const dx = curVal - lastVal;
        if (Math.abs(dx) > 0.015) {
          const dir = dx > 0 ? 1 : -1;
          if (lastDir !== 0 && dir !== lastDir) dirSwitches++;
          lastDir = dir;
          lastVal = curVal;
          totalTravel += Math.abs(dx);
        }
      }
      return (dirSwitches >= 2 && totalTravel > 0.05);
    }

    function checkDownwardMotion(history) {
      if (history.length < 3) return false;
      const len = history.length;
      const newest = history[len - 1];

      for (let i = 0; i < len - 1; i++) {
        const past = history[i];
        const dt = newest.time - past.time;
        if (dt >= 100 && dt <= 750) {
          if (newest.wrist.y - past.wrist.y > 0.035) return true;
        }
      }
      return false;
    }

    /* ==========================================================================
       3. 10개 수화 판별 규칙
       ========================================================================== */
    function classifySignGesture(lm, ext) {
      const now = performance.now();
      const openCount = ext.filter(Boolean).length;
      const isOpenPalm = openCount >= 4;
      const isFist = openCount === 0;
      const isFistLike = openCount <= 1;

      motionHistory.push({
        time: now,
        wrist: { x: lm[0].x, y: lm[0].y },
        indexTip: { x: lm[8].x, y: lm[8].y }
      });
      while (motionHistory.length > 0 && now - motionHistory[0].time > 1200) {
        motionHistory.shift();
      }

      /* 1. 동적 제스처 */
      if (isOpenPalm && (checkHorizontalWaving(motionHistory, 'wrist') || checkHorizontalWaving(motionHistory, 'indexTip'))) {
        dynamicLatch = { gesture: "안녕하세요", expireTime: now + 1200, confidence: 0.96, tip: "손 흔들기 감지! 👋" };
      } else if (isFistLike && checkDownwardMotion(motionHistory)) {
        dynamicLatch = { gesture: "감사합니다", expireTime: now + 1300, confidence: 0.96, tip: "주먹 내림 감지! 🙏" };
      } else if (ext[1] && !ext[2] && !ext[3] && !ext[4] && checkHorizontalWaving(motionHistory, 'indexTip')) {
        dynamicLatch = { gesture: "아니요", expireTime: now + 1200, confidence: 0.95, tip: "검지 흔들기! ☝️" };
      }

      if (dynamicLatch.expireTime > now) {
        return { gesture: dynamicLatch.gesture, confidence: dynamicLatch.confidence, ext: ext, tip: dynamicLatch.tip };
      }

      /* 2. 정적 제스처 */
      // 엄지만 펴진 경우: 좋아요 / 싫어요 / 주먹 판정 (엄지 각도에 따른 정밀 분류)
      if (ext[0] && !ext[1] && !ext[2] && !ext[3] && !ext[4]) {
        const thumbDiffY = lm[2].y - lm[4].y; // 양수면 엄지가 위로 향함
        if (thumbDiffY > 0.03) {
          return { gesture: "좋아요", confidence: 0.96, ext: ext, tip: "엄지 척! 👍" };
        } else if (thumbDiffY < -0.03) {
          return { gesture: "싫어요", confidence: 0.95, ext: ext, tip: "엄지 아래로! 👎" };
        } else {
          return { gesture: "주먹", confidence: 0.94, ext: ext, tip: "주먹 쥐기 ✊ (내리면 '감사합니다')" };
        }
      }

      // 엄지 + 소지: 사랑해요 (🤙)
      if (ext[0] && !ext[1] && !ext[2] && !ext[3] && ext[4]) {
        return { gesture: "사랑해요", confidence: 0.96, ext: ext, tip: "전화기 모양 사랑해요! 🤙" };
      }

      // 검지 + 중지: V (엄지는 쥐거나 가볍게 놓여있어도 V로 쾌적하게 인식)
      if (ext[1] && ext[2] && !ext[3] && !ext[4]) {
        return { gesture: "V", confidence: 0.97, ext: ext, tip: "승리의 브이! ✌️" };
      }

      // 모든 손가락 닫힘: 주먹
      if (isFist) {
        return { gesture: "주먹", confidence: 0.95, ext: ext, tip: "주먹 쥐기 ✊ (내리면 '감사합니다')" };
      }

      // 검지만 펴짐: 네
      if (!ext[0] && ext[1] && !ext[2] && !ext[3] && !ext[4]) {
        return { gesture: "네", confidence: 0.93, ext: ext, tip: "검지 하나 ☝️ ➔ '네'" };
      }

      // 엄지 + 검지 (L자): 도와주세요
      if (ext[0] && ext[1] && !ext[2] && !ext[3] && !ext[4]) {
        return { gesture: "도와주세요", confidence: 0.94, ext: ext, tip: "엄지+검지 L자 ➔ '도와주세요' 🆘" };
      }

      // 손바닥 전체 펴짐: 안녕하세요
      if (isOpenPalm) {
        return { gesture: "안녕하세요", confidence: 0.92, ext: ext, tip: "손을 펴고 살랑살랑 흔들어보세요 👋" };
      }

      return { gesture: null, confidence: 0.0, ext: ext, tip: "수화 동작을 취해보세요" };
    }

    /* ==========================================================================
       4. 800ms 디바운스 및 전송 처리 (400ms 프레임 유예)
       ========================================================================== */
    function processGestureDebounce(result, hasHands) {
      const now = performance.now();
      const { gesture, confidence, ext, tip } = result;

      const fingerNames = ['엄지', '검지', '중지', '약지', '소지'];
      for (let i = 0; i < 5; i++) {
        if (hasHands && ext[i]) {
          fingerPills[i].classList.add('active');
          fingerPills[i].textContent = `${fingerNames[i]} ON`;
        } else {
          fingerPills[i].classList.remove('active');
          fingerPills[i].textContent = `${fingerNames[i]} OFF`;
        }
      }

      if (tip) gestureTipEl.textContent = tip;

      // 손 없음 처리 (400ms 프레임 드랍 유예 기간 적용)
      if (!hasHands) {
        if (now - lastSeenTime > 400) {
          candidateGesture = null;
          candidateStartTime = 0;
          gestureNameEl.textContent = "손을 비춰주세요";
          confidenceValEl.textContent = "0%";
          statusTextEl.textContent = "손 없음";
          progressBarFillEl.style.width = '0%';
          topHudEl.classList.remove('confirmed');
          confirmedBadgeEl.style.display = 'none';
          diagSummaryEl.textContent = "진단: 손 없음";
        }
        return;
      }

      lastSeenTime = now;
      const openFingers = ext.filter(Boolean).length;
      diagSummaryEl.textContent = `진단: 손 감지 중 (${openFingers}개 ON)`;

      if (!gesture || confidence < 0.45) {
        candidateGesture = null;
        candidateStartTime = 0;
        gestureNameEl.textContent = "동작 인식 중...";
        confidenceValEl.textContent = `${Math.round(confidence * 100)}%`;
        statusTextEl.textContent = "동작 대기";
        progressBarFillEl.style.width = '0%';
        topHudEl.classList.remove('confirmed');
        confirmedBadgeEl.style.display = 'none';
        return;
      }

      if (gesture !== candidateGesture) {
        candidateGesture = gesture;
        candidateStartTime = now;
        topHudEl.classList.remove('confirmed');
        confirmedBadgeEl.style.display = 'none';
      }

      const elapsed = now - candidateStartTime;
      const progressPercent = Math.min(100, Math.floor((elapsed / DEBOUNCE_HOLD_TIME_MS) * 100));

      progressBarFillEl.style.width = `${progressPercent}%`;
      confidenceValEl.textContent = `${Math.round(confidence * 100)}%`;

      if (elapsed >= DEBOUNCE_HOLD_TIME_MS) {
        gestureNameEl.textContent = candidateGesture;
        statusTextEl.textContent = "인식 확정";
        topHudEl.classList.add('confirmed');
        confirmedBadgeEl.style.display = 'inline-block';

        if (candidateGesture !== lastSentGesture) {
          sendToAppInventor(candidateGesture);
          lastSentGesture = candidateGesture;
        }
      } else {
        gestureNameEl.textContent = candidateGesture;
        statusTextEl.textContent = `${Math.round(elapsed)}ms / ${DEBOUNCE_HOLD_TIME_MS}ms`;
      }
    }

    /* ==========================================================================
       5. 캔버스 뼈대 렌더링 (비디오와 1:1 완벽 정렬)
       ========================================================================== */
    function drawSkeleton(ctx, lm, w, h) {
      ctx.strokeStyle = "#00FF66";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";

      for (let k = 0; k < HAND_CONNECTIONS.length; k++) {
        const pair = HAND_CONNECTIONS[k];
        ctx.beginPath();
        ctx.moveTo(lm[pair[0]].x * w, lm[pair[0]].y * h);
        ctx.lineTo(lm[pair[1]].x * w, lm[pair[1]].y * h);
        ctx.stroke();
      }

      for (let i = 0; i < 21; i++) {
        const p = lm[i];
        ctx.beginPath();
        ctx.arc(p.x * w, p.y * h, 4, 0, 2 * Math.PI);
        ctx.fillStyle = "#00FF66";
        ctx.fill();
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    /* ==========================================================================
       6. 실시간 추론 및 렌더링 루프 (모바일 35 FPS 최적화)
       ========================================================================== */
    function renderLoop() {
      const now = performance.now();

      // 캔버스 크기를 비디오의 실제 네이티브 해상도와 동기화
      if (videoElement.videoWidth && (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight)) {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
      }

      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // 모바일 GPU 부하 조절: 약 28ms 간격 추론 (~35 FPS)
      if (handLandmarker && videoElement.readyState >= 2 && (now - lastInferTime >= 28)) {
        lastInferTime = now;
        try {
          const results = handLandmarker.detectForVideo(videoElement, now);
          const detected = results && results.landmarks && results.landmarks.length > 0;

          if (detected) {
            const lm = results.landmarks[0];
            const ext = detectFingerExtensions(lm);
            drawSkeleton(canvasCtx, lm, canvasElement.width, canvasElement.height);
            const classification = classifySignGesture(lm, ext);

            // 손가락이 화면 상/하단 경계에 잘릴 위험이 있을 때 안내
            const topFingerY = Math.min(lm[4].y, lm[8].y, lm[12].y, lm[16].y, lm[20].y);
            if (topFingerY < 0.06) {
              classification.tip = "손을 조금 내려주세요 ⬇️";
            } else if (lm[0].y > 0.94) {
              classification.tip = "손을 조금 올려주세요 ⬆️";
            }

            processGestureDebounce(classification, true);
          } else {
            processGestureDebounce({ gesture: null, confidence: 0.0, ext: [false,false,false,false,false], tip: "손을 카메라에 보여주세요 👋" }, false);
          }
        } catch (inferErr) {
          // 추론 스킵
        }
      }

      frameCount++;
      if (now - lastFpsTime >= 1000) {
        fpsCounterEl.textContent = `${frameCount} FPS`;
        frameCount = 0;
        lastFpsTime = now;
      }

      requestAnimationFrame(renderLoop);
    }

    /* ==========================================================================
       7. HandLandmarker Lite 모델 초기화 (병렬 다운로드 및 0.25 민감도)
       ========================================================================== */
    async function initHandLandmarker() {
      try {
        gestureNameEl.textContent = "AI 모델 다운로드 중...";
        diagSummaryEl.textContent = "진단: AI 모델 로딩 중";
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        const modelPath = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

        const options = {
          runningMode: "VIDEO",
          numHands: 1,
          minHandDetectionConfidence: 0.25, // 최초 손 포착 민감도 대폭 향상
          minHandPresenceConfidence: 0.25,
          minTrackingConfidence: 0.30
        };

        try {
          handLandmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: modelPath, delegate: "GPU" },
            ...options
          });
        } catch (gpuErr) {
          handLandmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: modelPath, delegate: "CPU" },
            ...options
          });
        }

        // GPU 셰이더 사전 컴파일 (Warm-up pass: 첫 프레임 버벅임 사전 제거)
        if (videoElement.readyState >= 2) {
          try { handLandmarker.detectForVideo(videoElement, performance.now()); } catch(e) {}
        }

        gestureNameEl.textContent = "손을 비춰주세요";
        statusTextEl.textContent = "대기 중";
        diagSummaryEl.textContent = "진단: 엔진 준비 완료";
        gestureTipEl.textContent = "💡 손목까지 화면에 들어오도록 30~50cm 거리에서 비춰주세요";
      } catch (err) {
        errorModalEl.style.display = 'flex';
      }
    }

    /* ==========================================================================
       8. 세로형 풀스크린 카메라 시동 (갤럭시 S25 9:16 최적화)
       ========================================================================== */
    async function startCamera() {
      try {
        let stream = null;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: "user",
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });
        } catch (e1) {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: {
                facingMode: "user",
                aspectRatio: { ideal: 9 / 16 },
                width: { ideal: 720 },
                height: { ideal: 1280 }
              }
            });
          } catch (e2) {
            try {
              stream = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: { facingMode: "user" }
              });
            } catch (e3) {
              stream = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: true
              });
            }
          }
        }

        videoElement.srcObject = stream;
        videoElement.setAttribute("playsinline", "");
        videoElement.setAttribute("autoplay", "");
        videoElement.setAttribute("muted", "");
        videoElement.muted = true;

        await new Promise((resolve) => {
          if (videoElement.readyState >= 2) {
            videoElement.play().catch(() => {}).then(resolve);
          } else {
            videoElement.onloadeddata = () => {
              videoElement.play().catch(() => {}).then(resolve);
            };
            setTimeout(() => {
              videoElement.play().catch(() => {}).then(resolve);
            }, 600);
          }
        });
      } catch (err) {
        errorModalEl.style.display = 'flex';
      }
    }

    /* ==========================================================================
       9. 카메라와 AI 모델 동시 병렬 초기화 (초기 대기시간 대폭 단축)
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', async () => {
      // 렌더링 루프를 즉시 시작하여 카메라 프리뷰가 뜨는 즉시 동기화
      requestAnimationFrame(renderLoop);

      // 카메라 구동과 AI 모델 다운로드를 동시에 병렬 실행
      await Promise.all([startCamera(), initHandLandmarker()]);

      // 둘 다 준비된 직후 1회 웜업 추론 실행 (셰이더 사전 컴파일)
      if (handLandmarker && videoElement.readyState >= 2) {
        try { handLandmarker.detectForVideo(videoElement, performance.now()); } catch(e) {}
      }
    });
  </script>
</body>
